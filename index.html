<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮克敏明信片座標收集站 (即時更新版)</title>
    <style>
        :root { --primary-color: #71b33c; --bg-color: #f4f9f0; --card-bg: #ffffff; --text-color: #333333; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary-color); }
        .filter-container { max-width: 1200px; margin: 0 auto 20px auto; background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; gap: 15px; flex-wrap: wrap; }
        select { padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.08); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card-img { width: 100%; height: 200px; object-fit: cover; background-color: #ddd; }
        .card-content { padding: 15px; }
        .card-title { font-size: 18px; font-weight: bold; margin: 0 0 10px 0; }
        .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 15px; }
        .tag { font-size: 12px; padding: 4px 8px; border-radius: 20px; font-weight: bold; }
        .tag-country { background: #e1f5fe; color: #0288d1; }
        .tag-type { background: #e8f5e9; color: #388e3c; }
        .copy-btn { width: 100%; background-color: var(--primary-color); color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .copy-btn:hover { background-color: #5c992e; }
        .copy-btn.copied { background-color: #333; }
        .loading { text-align: center; font-size: 18px; color: #666; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <h1>🌱 皮克敏明信片座標地圖分享 🌱</h1>
        <p>我連動了 Google 表格，在表格修改，這裡重新整理就會同步更新！</p>
    </header>

    <div class="filter-container">
        <select id="countryFilter" onchange="filterCards()">
            <option value="all">🌍 所有國家/地區</option>
            <option value="台灣">台灣</option>
            <option value="日本">日本</option>
            <option value="美國">美國</option>
            <option value="德國">德國</option>
            <option value="義大利">義大利</option>
            <option value="挪威">挪威</option>
            <option value="待分類">待分類</option>
        </select>
        <select id="typeFilter" onchange="filterCards()">
            <option value="all">🏷️ 所有類型</option>
            <option value="風景">風景</option>
            <option value="建築">建築</option>
            <option value="動漫">動漫</option>
            <option value="藝術">藝術</option>
            <option value="壁畫">壁畫</option>
        </select>
    </div>

    <div id="loading" class="loading">正在從 Google 表格載入最新明信片資料...</div>
    <div class="grid" id="postcardGrid" style="display: none;"></div>

    <script>
        // ⚠️ 請把下方網址替換成你的 Google Apps Script 網頁應用程式 URL
        const API_URL = "https://script.google.com/macros/s/AKfycbw3AxkzLI9D7jU5fRe2mcEET8RzMDAxYIFcw3VdQrYpAE3FVtBrqck48C4C9ky2Pkc/exec"; 

        let allData = [];

        // 從 Google 表格抓取資料
        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                allData = data;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('postcardGrid').style.display = 'grid';
                renderCards(data);
            })
            .catch(error => {
                document.getElementById('loading').innerText = '資料載入失敗，請檢查 API 網址是否正確或權限是否開放。';
                console.error('Error:', error);
            });

        // 渲染卡片到畫面上
        function renderCards(data) {
            const grid = document.getElementById('postcardGrid');
            grid.innerHTML = ''; // 清空原本內容

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-country', item.國家);
                card.setAttribute('data-type', item.類型);

                card.innerHTML = `
                    <img class="card-img" src="${item.照片 || 'https://placeholder.com'}" alt="${item.名稱}">
                    <div class="card-content">
                        <div class="card-title">${item.名稱}</div>
                        <div class="tags">
                            <span class="tag tag-country">${item.國家}</span>
                            <span class="tag tag-type">${item.類型}</span>
                        </div>
                        <button class="copy-btn" onclick="copyCoords('${item.座標}', this)">📋 複製座標</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 一鍵複製功能
        function copyCoords(coords, button) {
            navigator.clipboard.writeText(coords).then(() => {
                const originalText = button.innerText;
                button.innerText = "✅ 已複製！";
                button.classList.add('copied');
                setTimeout(() => {
                    button.innerText = originalText;
                    button.classList.remove('copied');
                }, 1500);
            }).catch(err => {
                alert('複製失敗: ' + coords);
            });
        }

        // 前端篩選功能
        function filterCards() {
            const countryValue = document.getElementById('countryFilter').value;
            const typeValue = document.getElementById('typeFilter').value;
            const cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                const cardCountry = card.getAttribute('data-country');
                const cardType = card.getAttribute('data-type');
                const countryMatch = (countryValue === 'all' || cardCountry === countryValue);
                const typeMatch = (typeValue === 'all' || cardType === typeValue);

                card.style.display = (countryMatch && typeMatch) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>

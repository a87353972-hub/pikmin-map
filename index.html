<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮克敏明信片座標收集站 (即時更新版)</title>
    <style>
        :root { --primary-color: #71b33c; --bg-color: #f4f9f0; --card-bg: #ffffff; --text-color: #333333; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 10px; } /* 💡 手機邊距縮小到 10px，挪出更多空間 */
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--primary-color); font-size: 22px; } /* 💡 標題也縮小一點符合手機 */
        .filter-container { max-width: 1200px; margin: 0 auto 15px auto; background: var(--card-bg); padding: 12px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; gap: 10px; flex-wrap: wrap; }
        select { padding: 6px 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px; flex: 1; min-width: 100px; }

        /* 💻 電腦版/大螢幕排版（維持原本的多欄，並排多張） */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 12px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.06); transition: transform 0.2s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); }
        
        /* ⭕ 圖片顯示優化：高度調成 160px，縮小一點點，用 contain 完整不裁切 */
        .card-img { width: 100%; height: 160px; object-fit: contain; background-color: #f5f8f2; }
        .card-content { padding: 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* ⭕ 字體微調，標題太長會自動變「...」不折行，維持乾淨 */
        .card-title { font-size: 14px; font-weight: bold; margin: 0 0 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
        .tag { font-size: 11px; padding: 2px 6px; border-radius: 20px; font-weight: bold; white-space: nowrap; }
        .tag-country { background: #e1f5fe; color: #0288d1; }
        .tag-type { background: #e8f5e9; color: #388e3c; }
        .tag-collect { background: #fff3e0; color: #e65100; } 
        
        .copy-btn { width: 100%; background-color: var(--primary-color); color: white; border: none; padding: 8px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .copy-btn:hover { background-color: #5c992e; }
        .copy-btn.copied { background-color: #333; }
        .loading { text-align: center; font-size: 16px; color: #666; margin-top: 50px; }

        /* 📱 關鍵加強：當螢幕寬度小於 600px（也就是手機版）時，啟用以下特殊規則 */
        @media (max-width: 600px) {
            .grid {
                /* ⭕ 核心修正：強制將卡片分為兩欄，每欄各佔一半空間 (50%)，間距改為 8px */
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 8px !important;
            }
            .card {
                border-radius: 10px !important; /* 💡 手機版卡片圓角縮小一點點 */
            }
            .card-img {
                height: 130px !important; /* 💡 手機版圖片高度跟著稍微縮小，更精緻 */
            }
            .card-content {
                padding: 8px !important; /* 💡 手機版內邊距縮小，留位置給標籤 */
            }
            .card-title {
                font-size: 13px !important; /* 💡 標題字體縮小 */
                margin-bottom: 4px !important;
            }
            .tag {
                font-size: 10px !important; /* 💡 標籤字體縮小 */
                padding: 1px 4px !important;
            }
            .copy-btn {
                padding: 6px !important; font-size: 11px !important; /* 💡 按鈕縮小符合右圖 */
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🌱 皮克敏明信片座標地圖分享 🌱</h1>
        <p>我連動了 Google 表格，在表格修改，這裡重新整理就會同步更新！</p>
    </header>

    <div class="filter-container">
        <select id="countryFilter" onchange="filterCards()">
            <option value="all">🌍 所有國家/地區</option>
            <option value="台灣">台灣</option>
            <option value="日本">日本</option>
            <option value="美國">美國</option>
            <option value="德國">德國</option>
            <option value="義大利">義大利</option>
            <option value="挪威">挪威</option>
            <option value="待分類">待分類</option>
        </select>
        <select id="typeFilter" onchange="filterCards()">
            <option value="all">🏷️ 所有類型</option>
            <option value="風景">風景</option>
            <option value="建築">建築</option>
            <option value="動漫">動漫</option>
            <option value="藝術">藝術</option>
            <option value="壁畫">壁畫</option>
        </select>
        <select id="collectFilter" onchange="filterCards()">
            <option value="all">🌸🍄 所有收集方式</option>
            <option value="菇點">菇點🍄</option>
            <option value="花點">花點🌸</option>
        </select>
    </div>

    <div id="loading" class="loading">正在從 Google 表格載入最新明信片資料...</div>
    <div class="grid" id="postcardGrid" style="display: none;"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw3AxkzLI9D7jU5fRe2mcEET8RzMDAxYIFcw3VdQrYpAE3FVtBrqck48C4C9ky2Pkc/exec"; 

        let allData = [];

        // 從 Google 表格抓取資料
        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                allData = data;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('postcardGrid').style.display = 'grid';
                renderCards(data);
            })
            .catch(error => {
                document.getElementById('loading').innerText = '資料載入失敗，請檢查 API 網址是否正確或權限是否開放。';
                console.error('Error:', error);
            });

        // 渲染卡片到畫面上
        function renderCards(data) {
            const grid = document.getElementById('postcardGrid');
            grid.innerHTML = ''; 

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-country', item.國家 || '');
                card.setAttribute('data-type', item.類型 || '');
                card.setAttribute('data-collect', item.種類 || ''); 

                const imageUrl = item.照片 || 'https://placeholder.com';

                card.innerHTML = `
                    <img class="card-img" src="${imageUrl}" alt="${item.名稱 || '皮克敏'}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='https://placeholder.com';">
                    <div class="card-content">
                        <div class="card-title">${item.名稱 || '無題'}</div>
                        <div class="tags">
                            <span class="tag tag-country">${item.國家 || '未分類'}</span>
                            <span class="tag tag-type">${item.類型 || '一般'}</span>
                            <span class="tag tag-collect">${item.種類 || '其他'}</span>
                        </div>
                        <button class="copy-btn" onclick="copyCoords('${item.座標 || ''}', this)">📋 複製座標</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 一鍵複製功能
        function copyCoords(coords, button) {
            if(!coords) { alert('這張明信片沒有填寫座標喔！'); return; }
            navigator.clipboard.writeText(coords).then(() => {
                const originalText = button.innerText;
                button.innerText = "✅ 已複製！";
                button.classList.add('copied');
                setTimeout(() => {
                    button.innerText = originalText;
                    button.classList.remove('copied');
                }, 1500);
            }).catch(err => {
                alert('複製失敗: ' + coords);
            });
        }

        // 前端篩選功能
        function filterCards() {
            const countryValue = document.getElementById('countryFilter').value;
            const typeValue = document.getElementById('typeFilter').value;
            const collectValue = document.getElementById('collectFilter').value; 
            const cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                const cardCountry = card.getAttribute('data-country');
                const cardType = card.getAttribute('data-type');
                const cardCollect = card.getAttribute('data-collect'); 

                const countryMatch = (countryValue === 'all' || cardCountry === countryValue);
                const typeMatch = (typeValue === 'all' || cardType === typeValue);
                const collectMatch = (collectValue === 'all' || cardCollect === collectValue); 

                card.style.display = (countryMatch && typeMatch && collectMatch) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
